name: Self-host release

# Builds downloadable artifacts for a self-hosted fork and publishes them to a GitHub Release.
#
# Push a tag (`git tag v1.4.0 && git push origin v1.4.0`) and this produces, attached to the
# release for that tag:
#   t3-<version>-linux-x64.tar.gz     self-contained CLI + server  (install.sh)
#   t3-<version>-linux-arm64.tar.gz
#   t3-<version>-darwin-arm64.tar.gz
#   t3-<version>-win32-x64.zip        (install.ps1)
#   SHA256SUMS                        what both installers verify against
#   *.dmg, *.AppImage, *.exe          desktop apps
#
# It deliberately does not reuse `release.yml`: that pipeline is gated on the upstream
# repository slug and runs on Blacksmith runners a fork does not have, so it silently does
# nothing here. This workflow calls the same reusable `release-desktop.yml` the upstream
# release does, on GitHub-hosted runners, with every signing secret optional.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (defaults to the selected ref)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: selfhost-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Resolve tag and version
        id: version
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+].*)?$ ]]; then
            echo "Tag '$tag' is not v<major>.<minor>.<patch>; refusing to publish." >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  # The same split the upstream pipeline uses: one job builds the JS bundle (server, web
  # client, Electron main), then one job per platform packages it. Building the bundle once
  # is what makes a five-artifact release possible without five full builds.
  bundle:
    name: Build JS bundle
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # Baked defaults: a user of this release inherits them and overrides any of them in
      # $T3CODE_HOME/.env. Empty here simply ships a build whose cloud features are off.
      T3CODE_CLERK_PUBLISHABLE_KEY: ${{ vars.T3CODE_CLERK_PUBLISHABLE_KEY }}
      T3CODE_CLERK_JWT_TEMPLATE: ${{ vars.T3CODE_CLERK_JWT_TEMPLATE }}
      T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: ${{ vars.T3CODE_CLERK_CLI_OAUTH_CLIENT_ID }}
      T3CODE_RELAY_URL: ${{ vars.T3CODE_RELAY_URL }}
      T3CODE_HOSTED_APP_URL: ${{ vars.T3CODE_HOSTED_APP_URL }}
      T3CODE_GITHUB_REPOSITORY: ${{ github.repository }}
      T3CODE_RELEASE_REPOSITORY: ${{ github.repository }}
      T3CODE_TELEMETRY_CHANNEL: dev
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      - name: Align package versions to the tag
        run: node scripts/update-release-package-versions.ts "${{ needs.prepare.outputs.version }}"

      # Older refs lack build:desktop:bundle and need the full build, which compiles the
      # Linux browser secret helper and needs libsecret.
      - name: Check bundle-only build support
        id: bundle_build
        run: |
          script="$(node -p "require('./package.json').scripts['build:desktop:bundle'] ? 'build:desktop:bundle' : 'build:desktop'")"
          echo "script=$script" >> "$GITHUB_OUTPUT"

      - name: Install browser secret helper build libraries
        if: steps.bundle_build.outputs.script == 'build:desktop'
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config

      - name: Build JS bundle
        run: vp run ${{ steps.bundle_build.outputs.script }}

      - name: Upload JS bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error
          retention-days: 1

  # macOS x64 has no CLI archive: Node single-executables are unsupported on x64 macOS.
  mac_arm64:
    name: macOS arm64
    needs: [prepare, bundle]
    uses: ./.github/workflows/release-desktop.yml
    secrets: inherit
    with:
      version: ${{ needs.prepare.outputs.version }}
      ref: ${{ needs.prepare.outputs.tag }}
      release_channel: dev
      clerk_publishable_key: ${{ vars.T3CODE_CLERK_PUBLISHABLE_KEY }}
      clerk_jwt_template: ${{ vars.T3CODE_CLERK_JWT_TEMPLATE }}
      clerk_cli_oauth_client_id: ${{ vars.T3CODE_CLERK_CLI_OAUTH_CLIENT_ID }}
      relay_url: ${{ vars.T3CODE_RELAY_URL }}
      label: macOS arm64
      runner: macos-latest
      platform: mac
      target: dmg
      arch: arm64
      rust_target: aarch64-apple-darwin
      resource_key: darwin-arm64
      cli_archive: true
      relay_client_tracing: false
      launch_check: false
      save_pnpm_store: false

  mac_x64:
    name: macOS x64
    needs: [prepare, bundle]
    uses: ./.github/workflows/release-desktop.yml
    secrets: inherit
    with:
      version: ${{ needs.prepare.outputs.version }}
      ref: ${{ needs.prepare.outputs.tag }}
      release_channel: dev
      clerk_publishable_key: ${{ vars.T3CODE_CLERK_PUBLISHABLE_KEY }}
      clerk_jwt_template: ${{ vars.T3CODE_CLERK_JWT_TEMPLATE }}
      clerk_cli_oauth_client_id: ${{ vars.T3CODE_CLERK_CLI_OAUTH_CLIENT_ID }}
      relay_url: ${{ vars.T3CODE_RELAY_URL }}
      label: macOS x64
      runner: macos-latest
      platform: mac
      target: dmg
      arch: x64
      rust_target: x86_64-apple-darwin
      resource_key: darwin-x64
      cli_archive: false
      relay_client_tracing: false
      launch_check: false

  linux_x64:
    name: Linux x64
    needs: [prepare, bundle]
    uses: ./.github/workflows/release-desktop.yml
    secrets: inherit
    with:
      version: ${{ needs.prepare.outputs.version }}
      ref: ${{ needs.prepare.outputs.tag }}
      release_channel: dev
      clerk_publishable_key: ${{ vars.T3CODE_CLERK_PUBLISHABLE_KEY }}
      clerk_jwt_template: ${{ vars.T3CODE_CLERK_JWT_TEMPLATE }}
      clerk_cli_oauth_client_id: ${{ vars.T3CODE_CLERK_CLI_OAUTH_CLIENT_ID }}
      relay_url: ${{ vars.T3CODE_RELAY_URL }}
      label: Linux x64
      runner: ubuntu-24.04
      platform: linux
      target: AppImage
      arch: x64
      rust_target: x86_64-unknown-linux-gnu
      resource_key: linux-x64
      cli_archive: true
      relay_client_tracing: false
      # AppImage needs FUSE, which the hosted runners do not mount.
      launch_check: false

  # node-pty has no Linux prebuild and compiles from source, so arm64 is built on arm64.
  linux_arm64:
    name: Linux arm64
    needs: [prepare, bundle]
    uses: ./.github/workflows/release-desktop.yml
    secrets: inherit
    with:
      version: ${{ needs.prepare.outputs.version }}
      ref: ${{ needs.prepare.outputs.tag }}
      release_channel: dev
      clerk_publishable_key: ${{ vars.T3CODE_CLERK_PUBLISHABLE_KEY }}
      clerk_jwt_template: ${{ vars.T3CODE_CLERK_JWT_TEMPLATE }}
      clerk_cli_oauth_client_id: ${{ vars.T3CODE_CLERK_CLI_OAUTH_CLIENT_ID }}
      relay_url: ${{ vars.T3CODE_RELAY_URL }}
      label: Linux arm64
      runner: ubuntu-24.04-arm
      platform: linux
      target: AppImage
      arch: arm64
      rust_target: aarch64-unknown-linux-gnu
      resource_key: linux-arm64
      cli_archive: true
      relay_client_tracing: false
      launch_check: false

  # Packaging runs on Linux (faster for small-file work); only the native checks run on a
  # Windows runner. This job also embeds the same-arch Linux CLI archive as the WSL runtime,
  # which is why it waits on linux_x64 rather than only on the bundle.
  win_x64:
    name: Windows x64
    needs: [prepare, bundle, linux_x64]
    uses: ./.github/workflows/release-desktop.yml
    secrets: inherit
    with:
      version: ${{ needs.prepare.outputs.version }}
      ref: ${{ needs.prepare.outputs.tag }}
      release_channel: dev
      clerk_publishable_key: ${{ vars.T3CODE_CLERK_PUBLISHABLE_KEY }}
      clerk_jwt_template: ${{ vars.T3CODE_CLERK_JWT_TEMPLATE }}
      clerk_cli_oauth_client_id: ${{ vars.T3CODE_CLERK_CLI_OAUTH_CLIENT_ID }}
      relay_url: ${{ vars.T3CODE_RELAY_URL }}
      label: Windows x64
      runner: ubuntu-24.04
      verify_runner: windows-2025
      platform: win
      target: nsis
      arch: x64
      rust_target: x86_64-pc-windows-msvc
      resource_key: win32-x64
      cli_archive: true
      relay_client_tracing: false
      launch_check: false

  publish:
    name: Publish release
    needs: [prepare, mac_arm64, linux_x64, linux_arm64, win_x64]
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download CLI archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cli-*
          merge-multiple: true
          path: release-assets

      - name: Download desktop installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets

      # Both installers verify the CLI archives against this file, so it is written from the
      # bytes that actually get uploaded.
      - name: Write CLI archive checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          shopt -s nullglob
          archives=(t3-*.tar.gz t3-*.zip)
          if [[ ${#archives[@]} -eq 0 ]]; then
            echo "No CLI archives were produced." >&2
            exit 1
          fi
          sha256sum "${archives[@]}" > SHA256SUMS
          cat SHA256SUMS

      # electron-updater manifests and blockmaps are intentionally not published: a fork that
      # is not the upstream release channel must not hand an update feed to anyone else's
      # build. The desktop app falls back to "updates unavailable" when they are absent.
      - name: Drop updater metadata
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          shopt -s nullglob
          rm -f ./*.yml ./*.blockmap
          ls -lh

      - name: Publish to GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* \
              --title "T3 Code $VERSION" \
              --notes "Self-hosted build of T3 Code $VERSION.

          Install the CLI:
          \`\`\`
          curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}/scripts/install.sh | sh
          \`\`\`

          Configure it in \`\$T3CODE_HOME/.env\` (Clerk keys, Cloudflare tunnel, telemetry) — see
          \`.env.example\`. No rebuild is needed for those values." \
              --verify-tag
          fi
